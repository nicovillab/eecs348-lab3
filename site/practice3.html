    <div class="eyebrow">03 / JavaScript Password Verification</div>
    <h1>Say it twice.</h1>
    <p class="lede">At least 8 characters, and both entries must match.</p>
  </div>
  <form class="panel" style="max-width:480px" onsubmit="verifyPassword();return false;">
    <div class="field"><label for="pw1">Password</label><input id="pw1" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <button class="btn" type="submit">Verify</button>
    <div id="pwMsg" class="msg"></div>
  </form>
</main>
<div id="popup" class="popup" hidden>
  <div class="popup-card">
    <div id="popupTitle" class="popup-title">Passwords match</div>
